# App Port Allocation Configuration
server.port=${PORT:8080}

# Database Connection Directives (Adapts dynamically to Cloud DB URLs)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Arvind@88000}

# Hibernate Automation Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Security Core Configurations
app.jwt.secret=${JWT_SECRET:fallbackSecretKeyConfigurationTokenStringDoNotUseInProduction1234567890}
app.jwt.expiration-ms=86400000
